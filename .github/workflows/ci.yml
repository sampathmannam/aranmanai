name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Create venv + install
        run: |
          python -m venv venv
          .\venv\Scripts\python.exe -m pip install --upgrade pip wheel setuptools
          .\venv\Scripts\python.exe -m pip install -e ".[dev,ml]"

      - name: Lint
        run: .\venv\Scripts\python.exe -m ruff check src/ tests/ scripts/

      - name: Type check
        run: .\venv\Scripts\python.exe -m mypy src/ --ignore-missing-imports

      - name: Test
        env:
          ARANMANAI_LLM_BACKEND: mock
        run: |
          .\venv\Scripts\python.exe -m pytest tests/ -v --tb=short --cov=aranmanai --cov-report=term-missing
