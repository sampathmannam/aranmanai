[project]
name = "aranmanai"
version = "0.1.0"
description = "District-scoped conviction-rate management platform (Lean solo v1, IPS SP-of-district lens)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Sampath M (IPS, SP)", email = "sampathmannam@gmail.com" },
]
keywords = ["police", "conviction-rate", "ai", "fastapi", "india", "ipc", "bns", "bnss", "bsa", "court-monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Information Technology",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "python-multipart==0.0.12",
    "sqlalchemy==2.0.36",
    "sqlcipher3==0.6.2",
    "httpx==0.27.2",
    "python-jose[cryptography]==3.3.0",
    "passlib==1.7.4",
    "bcrypt>=4.0,<5.0",  # pin <5 — passlib 1.7.4 reads bcrypt.__about__ which was removed in 5.x
    "cryptography==43.0.3",
    "filelock==3.32.4",  # cross-process lock for the hash-chained audit log (multi-worker uvicorn safety)
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "ruff==0.7.2",
    "mypy==1.13.0",
    "types-requests==2.33.0.20260712",
    "structlog==24.4.0",
    "llama-cpp-python==0.3.2",
    "streamlit==1.40.0",
    "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest-watch==4.2.0",
    "ipython==8.27.0",
    "pre-commit==3.8.0",
]
voice = [
    "openai-whisper==20240930",
    "silero-vad==5.1",
    "TTS==0.22.0",
]
ml = [
    "lightgbm==4.5.0",
    "scikit-learn==1.5.2",
    "numpy==2.1.2",
    "pandas==2.2.3",
    "sentence-transformers==3.0.1",
    "chromadb==0.5.18",
]

[project.scripts]
aranmanai-api = "scripts.run_api:main"
aranmanai-init = "scripts.init_db:main"
aranmanai-download = "scripts.download_model:main"

[project.urls]
"Bug Tracker" = "https://github.com/sampathmannam/aranmanai/issues"
"Source" = "https://github.com/sampathmannam/aranmanai"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts (and the Streamlit frontend entrypoint) insert the repo
# root onto sys.path before importing aranmanai.* so they work when run
# directly (not via the installed package) -- the import can't move above
# the sys.path.insert() that makes it resolvable.
"scripts/*.py" = ["E402"]
"src/aranmanai/frontend/app.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_return_any = false
