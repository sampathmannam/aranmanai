[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aranmanai"
version = "0.1.0"
description = "District conviction-rate management platform for Indian police"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sampath M (IPS)", email = "sampathmannam@gmail.com" },
]
keywords = ["police", "conviction-rate", "india", "bns", "bnss", "bsa", "court-monitoring", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Sociology",
]

[project.urls]
"Source" = "https://github.com/sampathmannam/aranmanai"
"Bug Reports" = "https://github.com/sampathmannam/aranmanai/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
]
llm = [
    "llama-cpp-python>=0.3",
    # Optional: torch for GPU acceleration
    # "torch>=2.4",
]
voice = [
    # Whisper STT
    "openai-whisper>=20231117",
    # Or faster: faster-whisper
    # "faster-whisper>=1.0",
    "soundfile>=0.12",
]
tamil = [
    "indic-trans2>=1.0",
    # Or sentence-transformers
    "sentence-transformers>=3.0",
]
all = [
    "llama-cpp-python>=0.3",
    "openai-whisper>=20231117",
    "indic-trans2>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aranmanai" = ["ai/prompts/*.md", "*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]  # line-too-long, function-call-in-default-argument

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true  # many third-party libs lack types

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests that need a live server (deselect with -m 'not integration')",
    "slow: marks slow tests (deselect with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning:sqlalchemy.*",
    "ignore::DeprecationWarning:passlib.*",
]

[tool.coverage.run]
source = ["src/aranmanai"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]
